---
name: Python lints

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "--version"
      - run: ruff format --check
      - run: ruff check --fix --output-format=github .

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: 3.x
      - uses: actions/checkout@v4
      - run: pip install mypy numpy pytest
      - run: mypy

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
      - run: pip install -e ".[testing]"
      # Every committed eval spec must still resolve against its pinned dataset
      # revision, so a spec cannot silently stop reproducing its own conditions.
      - run: pytest tests/ -v
